[project]
name = "trenches-sol"
version = "0.1.0"
description = "Read-only measurement of sandwich exposure on Solana pump.fun and PumpSwap (thesis research)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    "base58>=2.1",
    "duckdb>=1.5",
    "lightgbm>=4.7",
    "numpy>=2.5",
    "orjson>=3.13",
    "pandas>=3.0",
    "pyarrow>=26.0",
    "scikit-learn>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[tool.setuptools.packages.find]
include = ["tsol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
